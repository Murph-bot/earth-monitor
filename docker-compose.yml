services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: earth_monitor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d earth_monitor"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file:
      - path: backend/.env
        required: false
    environment:
      EM_DATABASE_URL: postgresql://postgres:postgres@db:5432/earth_monitor
      EM_ENVIRONMENT: dev
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ingestion worker — separate process from the API by design (Phase 4).
  # Same image; the command swaps uvicorn for the poll loop.
  ingest:
    build: ./backend
    command: ["python", "-m", "app.ingest"]
    env_file:
      - path: backend/.env
        required: false
    environment:
      EM_DATABASE_URL: postgresql://postgres:postgres@db:5432/earth_monitor
      EM_ENVIRONMENT: dev
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
