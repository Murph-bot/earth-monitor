name: backfill

# Manual re-ingest of one AOI over an explicit window (idempotent; does not
# move the sweep watermark). Example:
#   gh workflow run backfill.yml -f aoi_id=<uuid> -f since=2026-10-15 -f until=2026-10-23 -f sensor=sentinel-2
on:
  workflow_dispatch:
    inputs:
      aoi_id:
        description: AOI uuid
        required: true
      since:
        description: window start YYYY-MM-DD (inclusive)
        required: true
      until:
        description: window end YYYY-MM-DD (inclusive, default today)
        required: false
      sensor:
        description: sensor id (blank = all adapter-backed sensors)
        required: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.9"
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: backfill
        env:
          EM_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EM_ENVIRONMENT: prod
          AOI_ID: ${{ inputs.aoi_id }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          SENSOR: ${{ inputs.sensor }}
        run: |
          args=(--backfill "$AOI_ID" --since "$SINCE")
          [ -n "$UNTIL" ] && args+=(--until "$UNTIL")
          [ -n "$SENSOR" ] && args+=(--sensor "$SENSOR")
          uv run python -m app.ingest "${args[@]}"
