[project]
name = "earth-monitor-backend"
version = "0.1.0"
description = "earth-monitor API and ingestion backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "pystac-client>=0.9.0",
    "rasterio>=1.5.1",
    "numpy>=2.5.3",
    "psycopg[binary,pool]>=3.3.6",
    "rio-tiler>=7.0",
    "pillow>=10",
    "pyjwt>=2.10",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.13",
    "httpx2>=2.13.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: hits live external catalogs (skipped unless EM_INTEGRATION=1)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."

# rasterio ships no py.typed marker and rasterio-stubs doesn't resolve on
# py3.12+; the geo stack's untyped edge is contained to this override.
[[tool.mypy.overrides]]
module = ["rasterio.*", "affine.*"]
ignore_missing_imports = true
